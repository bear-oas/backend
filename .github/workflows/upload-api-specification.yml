# dev/stg/prod 브랜치에 PR이 병합되면, API 명세를 빌드한 뒤에 명세 보관소 레포지토리로 업로드하는 워크플로우
name: Upload API Specification

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - stg
      - prod

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCHES: '["dev","stg","prod"]'

jobs:
  build-and-upload-api-specification:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: 브랜치 이름 확인 및 유효성 검사
        id: branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetBranches = JSON.parse(process.env.TARGET_BRANCHES);
            const baseBranch = context.payload.pull_request.base.ref;

            if (!targetBranches.includes(baseBranch)) {
              core.setFailed(`브랜치 ${baseBranch}는 대상 브랜치가 아닙니다. 대상: ${targetBranches.join(', ')}`);
              return;
            }

            core.setOutput('branch', baseBranch);
            core.info(`대상 브랜치: ${baseBranch}`);

      - name: 대상 브랜치 체크아웃
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.branch.outputs.branch }}

      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/gradle/wrapper/gradle-wrapper.properties
            **/gradle.properties
            **/build.gradle*

      - name: gradlew를 실행 가능하도록 설정
        run: chmod +x ./gradlew

      - name: 빌드 결과물 삭제
        run: ./gradlew clean

      - name: OpenAPI 명세 생성
        run: |
          ./gradlew generateOpenApiDocs
          echo "OpenAPI 명세 생성 완료"

      - name: 생성된 OpenAPI JSON 확인 및 복사
        run: |
          ls -lh build/openapi/
          cp build/openapi/openapi.json ./openapi.json
          echo "생성된 OpenAPI 명세:"
          head -20 openapi.json

      - name: 파일명 생성 (YYYYMMDD-uuid.json)
        id: filename
        run: |
          DATE=$(date +'%Y%m%d')
          UUID=$(uuidgen)
          FILENAME="${DATE}-${UUID}.json"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "생성된 파일명: ${FILENAME}"

      - name: Specification 레포지토리 체크아웃
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/specification
          token: ${{ secrets.SPECIFICATION_REPO_TOKEN }}
          path: specification-repo
          ref: main

      - name: 브랜치별 디렉토리에 명세 파일 업로드 및 latest.json 생성
        run: |
          cd specification-repo

          BRANCH_NAME="${{ steps.branch.outputs.branch }}"

          # 브랜치별 디렉토리가 없으면 생성
          mkdir -p ${BRANCH_NAME}

          # 생성된 명세를 브랜치별 디렉토리에 복사 (타임스탬프 버전)
          cp ../openapi.json ${BRANCH_NAME}/${{ steps.filename.outputs.filename }}

          # latest.json 파일 생성 (동일한 내용)
          cp ../openapi.json ${BRANCH_NAME}/latest.json

          # Git 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 변경사항 커밋 및 푸시
          git add ${BRANCH_NAME}/${{ steps.filename.outputs.filename }} ${BRANCH_NAME}/latest.json
          git commit -m "chore: Upload API specification ${{ steps.filename.outputs.filename }} to ${BRANCH_NAME}"
          git push origin main
